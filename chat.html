<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Assistant</title>
<style>
  :root { color-scheme: dark; --bg: #1e1f24; --panel: #272930; --line: #3a3d47; --me: #3b5bdb; --text: #ececf1; --muted: #9aa0ab; --accent: #d9774b; }
  * { box-sizing: border-box }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, sans-serif }
  header { -webkit-app-region: drag; display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--panel); border-bottom: 1px solid var(--line) }
  #name { flex: 1; min-width: 0; padding: 2px 4px; border: 1px solid transparent; border-radius: 6px; background: none; color: var(--text); font: 600 14px "Segoe UI", system-ui, sans-serif; -webkit-app-region: no-drag }
  #name:hover { border-color: var(--line) }
  #name:focus { border-color: var(--accent); background: var(--bg); outline: none }
  header button { -webkit-app-region: no-drag }
  #log { flex: 1; overflow-y: auto; padding: 12px 10px; display: flex; flex-direction: column; gap: 8px }
  .msg { max-width: 88%; padding: 8px 11px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text }
  .me { align-self: flex-end; background: var(--me); border-bottom-right-radius: 4px }
  .bot { align-self: flex-start; background: var(--panel); border-bottom-left-radius: 4px }
  .error { color: #ff9b9b }
  .tool { align-self: flex-start; color: var(--muted); font: 12px/1.4 Consolas, monospace; overflow-wrap: anywhere }
  #status { min-height: 18px; padding: 0 12px 4px; color: var(--muted); font-size: 12px }
  footer { display: flex; gap: 6px; padding: 8px; background: var(--panel); border-top: 1px solid var(--line) }
  textarea { flex: 1; height: 58px; resize: none; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit }
  button { border: 0; border-radius: 8px; padding: 6px 12px; background: #3a3d47; color: var(--text); font: inherit; cursor: pointer }
  button:disabled { opacity: 0.5; cursor: default }
  button.primary { background: var(--accent); color: #fff }
  #mic.on { background: #c0392b }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px }
</style>
</head>
<body>
<header><input id="name" maxlength="24" title="Click to rename" aria-label="Assistant name" spellcheck="false"><button id="new" title="Clear the chat (he still remembers everything)">Clear</button><button id="close" title="Hide" aria-label="Hide">✕</button></header>
<div id="log" aria-live="polite"></div>
<div id="status"></div>
<footer>
  <textarea id="input" placeholder="Ask anything or give me a task…" aria-label="Message"></textarea>
  <button id="mic" title="Speak (Ctrl+Alt+Space)" aria-label="Speak">🎤</button>
  <button id="send" class="primary">Send</button>
</footer>
<script>
  const $ = (id) => document.getElementById(id);
  const log = $('log');
  let busy = false;

  function add(cls, text) {
    const d = document.createElement('div');
    d.className = cls;
    d.textContent = text;
    log.append(d);
    log.scrollTop = log.scrollHeight;
    return d;
  }
  // his name: shown in the header, click it to rename
  let name = new URLSearchParams(location.search).get('name') || 'Assistant';
  const nameBox = $('name');
  nameBox.value = name;
  function rename() {
    const v = nameBox.value.replace(/\s+/g, ' ').trim();
    if (v && v !== name) { name = v; bridge.send('set-name', v); }
    nameBox.value = name;
  }
  nameBox.onchange = rename;
  nameBox.onkeydown = (e) => {
    if (e.key === 'Enter') { rename(); $('input').focus(); }
    if (e.key === 'Escape') { e.stopPropagation(); nameBox.value = name; $('input').focus(); }
  };
  const greet = () => add('msg bot', `Hi! I'm ${name}. Ask me a question, or give me a task on this computer.`);
  greet();

  // he answers in the language of the request: Whisper's guess when spoken, the script when typed
  let replyLang = 'en', voiced = false;
  function send(lang) {
    const text = $('input').value.trim();
    if (!text || busy) return;
    voiced = !!lang; // asked by voice -> answered by voice, even with "Speak replies" off
    replyLang = lang || (/[а-яё]/i.test(text) ? 'ru' : 'en');
    finish(false);
    speechSynthesis.cancel();
    add('msg me', text);
    $('input').value = '';
    bridge.send('ask', text);
  }
  $('send').onclick = () => (busy ? bridge.send('stop') : send());
  $('input').onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } };
  // voice in: record 16 kHz mono samples, stop after ~1.5 s of quiet once speech was heard (or on a mic click),
  // then main transcribes them with local Whisper and the text is sent like a typed message
  let rec = null;
  const listening = () => !!rec;
  async function listen(on) {
    if (!on) return finish(false);
    if (rec || busy) return;
    speechSynthesis.cancel();
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
    } catch (e) {
      return add('msg bot error', `I can't use the microphone: ${e.message}. Check Windows Settings > Privacy > Microphone.`);
    }
    const ac = new AudioContext({ sampleRate: 16000 });
    // ponytail: ScriptProcessor is deprecated but needs no extra file; move to an AudioWorklet if Chromium drops it
    const node = ac.createScriptProcessor(4096, 1, 1);
    const chunks = [];
    let heard = false, quiet = 0, total = 0;
    node.onaudioprocess = (e) => {
      const x = new Float32Array(e.inputBuffer.getChannelData(0));
      chunks.push(x);
      total += x.length;
      const rms = Math.sqrt(x.reduce((sum, v) => sum + v * v, 0) / x.length);
      if (rms > 0.015) { heard = true; quiet = 0; } else quiet += x.length;
      if ((heard && quiet > 16000 * 1.5) || total > 16000 * 30) finish(true);
    };
    ac.createMediaStreamSource(stream).connect(node);
    node.connect(ac.destination); // a ScriptProcessor only runs while connected
    rec = { ac, stream, chunks, heard: () => heard };
    $('mic').classList.add('on');
    $('status').textContent = 'Listening… I send when you pause';
  }
  function finish(keep) {
    if (!rec) return;
    const { ac, stream, chunks, heard } = rec;
    rec = null;
    stream.getTracks().forEach((t) => t.stop());
    ac.close();
    $('mic').classList.remove('on');
    $('status').textContent = '';
    if (!keep || !heard()) return;
    const all = new Float32Array(chunks.reduce((n, c) => n + c.length, 0));
    let at = 0;
    for (const c of chunks) { all.set(c, at); at += c.length; }
    $('status').textContent = 'Transcribing…';
    bridge.send('transcribe', all.buffer);
  }
  $('mic').onclick = () => (rec ? finish(true) : listen(true));

  // voice out: read his replies aloud with a Windows voice in the language he was asked in
  let speak = new URLSearchParams(location.search).get('speak') === '1';
  // the voice list loads asynchronously: until it's there an utterance gets no voice and Windows' default (possibly a
  // Russian one) reads it, so replies wait for the list
  let voiceList = speechSynthesis.getVoices();
  speechSynthesis.addEventListener('voiceschanged', () => { voiceList = speechSynthesis.getVoices(); });
  // he's a guy: always the same male voice per language (David for English, Pavel for Russian here), else any in it
  const MALE = /david|mark|guy|andrew|brian|christopher|eric|roger|steffan|pavel|dmitry|male/i;
  function voiceFor(lang) {
    const vs = voiceList.filter((v) => v.lang.toLowerCase().startsWith(lang));
    return vs.find((v) => MALE.test(v.name) && !/female/i.test(v.name)) ?? vs[0] ?? null;
  }
  // splits text into runs of Russian and of Latin-script words, each read by a voice of its own language: one Russian
  // word in an English reply no longer makes the Russian voice read all of it (that was the heavy accent)
  function runs(text) {
    const out = [];
    for (const word of text.split(/(\s+)/)) {
      const lang = /[а-яё]/i.test(word) ? 'ru' : /[a-z]/i.test(word) ? (replyLang === 'ru' ? 'en' : replyLang) : null;
      const last = out[out.length - 1];
      if (last && (!lang || lang === last[0])) last[1] += word; // spaces, numbers, punctuation stay with their run
      else out.push([lang ?? (replyLang === 'ru' ? 'ru' : 'en'), word]);
    }
    return out.filter(([, part]) => part.trim());
  }
  function say(text) {
    if (!speak && !voiced) return;
    // read words only: no markdown symbols, no emoji (with their joiners and variation selectors)
    const words = text.replace(/[`*_#>]/g, '').replace(/[\p{Extended_Pictographic}\p{Emoji_Modifier}\u200d\ufe0f]/gu, '').trim();
    if (!words) return;
    if (!voiceList.length) return void speechSynthesis.addEventListener('voiceschanged', () => say(text), { once: true });
    for (const [lang, part] of runs(words)) {
      const u = new SpeechSynthesisUtterance(part);
      u.voice = voiceFor(lang);
      u.lang = u.voice?.lang ?? lang;
      if (!u.voice) $('status').textContent = `No ${lang} voice installed: add one in Windows Settings > Time & language > Speech.`;
      // his mouth moves while any reply is being spoken (replies and runs queue up)
      u.onstart = () => bridge.send('talking', true);
      u.onend = u.onerror = () => setTimeout(() => bridge.send('talking', speechSynthesis.speaking), 50);
      speechSynthesis.speak(u);
    }
  }

  $('close').onclick = () => bridge.send('hide-chat');
  $('new').onclick = () => bridge.send('new-chat');
  addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (listening()) finish(false);
    else bridge.send('hide-chat');
  });

  bridge.on('assistant', (m) => {
    if (m.type === 'text') { add('msg bot', m.text); if (!m.silent) say(m.text); } // silent: not read aloud
    if (m.type === 'tool') add('tool', '▸ ' + m.text);
    if (m.type === 'error') add('msg bot error', m.text);
    if (m.type === 'reset') { log.innerHTML = ''; greet(); }
    if (m.type === 'rename') { nameBox.focus(); nameBox.select(); }
    if (m.type === 'listen') listen(true);
    if (m.type === 'status') $('status').textContent = m.text;
    if (m.type === 'heard') {
      $('status').textContent = m.text ? '' : "Sorry, I didn't catch that.";
      if (m.text) { $('input').value = m.text; send(m.lang || 'en'); }
    }
    if (m.type === 'speak') { speak = m.on; if (!speak) speechSynthesis.cancel(); }
    if (m.type === 'busy') {
      busy = m.on;
      $('send').textContent = busy ? 'Stop' : 'Send';
      if (!listening()) $('status').textContent = busy ? 'Working…' : '';
      if (!busy) $('input').focus();
    }
  });
</script>
</body>
</html>
