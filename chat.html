<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Assistant</title>
<style>
  :root { color-scheme: dark; --bg: #1e1f24; --panel: #272930; --line: #3a3d47; --me: #3b5bdb; --text: #ececf1; --muted: #9aa0ab; --accent: #d9774b; }
  * { box-sizing: border-box }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, sans-serif }
  header { -webkit-app-region: drag; display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--panel); border-bottom: 1px solid var(--line) }
  header b { flex: 1 }
  header button { -webkit-app-region: no-drag }
  #log { flex: 1; overflow-y: auto; padding: 12px 10px; display: flex; flex-direction: column; gap: 8px }
  .msg { max-width: 88%; padding: 8px 11px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text }
  .me { align-self: flex-end; background: var(--me); border-bottom-right-radius: 4px }
  .bot { align-self: flex-start; background: var(--panel); border-bottom-left-radius: 4px }
  .error { color: #ff9b9b }
  .tool { align-self: flex-start; color: var(--muted); font: 12px/1.4 Consolas, monospace; overflow-wrap: anywhere }
  .ask { align-self: stretch; border: 1px solid var(--accent); background: #33291f; border-radius: 10px; padding: 8px 10px }
  .ask ul { margin: 6px 0; padding-left: 18px; font: 12px/1.4 Consolas, monospace; overflow-wrap: anywhere }
  .ask div { display: flex; gap: 6px }
  #status { min-height: 18px; padding: 0 12px 4px; color: var(--muted); font-size: 12px }
  footer { display: flex; gap: 6px; padding: 8px; background: var(--panel); border-top: 1px solid var(--line) }
  textarea { flex: 1; height: 58px; resize: none; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit }
  button { border: 0; border-radius: 8px; padding: 6px 12px; background: #3a3d47; color: var(--text); font: inherit; cursor: pointer }
  button:disabled { opacity: 0.5; cursor: default }
  button.primary { background: var(--accent); color: #fff }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px }
</style>
</head>
<body>
<header><b>Assistant</b><button id="new" title="Start a new conversation">New</button><button id="close" title="Hide" aria-label="Hide">✕</button></header>
<div id="log" aria-live="polite"></div>
<div id="status"></div>
<footer>
  <textarea id="input" placeholder="Ask anything or give me a task…" aria-label="Message"></textarea>
  <button id="send" class="primary">Send</button>
</footer>
<script>
  const $ = (id) => document.getElementById(id);
  const log = $('log');
  let busy = false;

  function add(cls, text) {
    const d = document.createElement('div');
    d.className = cls;
    d.textContent = text;
    log.append(d);
    log.scrollTop = log.scrollHeight;
    return d;
  }
  const greet = () => add('msg bot', "Hi! I'm your desktop assistant. Ask me a question, or give me a task on this computer.");
  greet();

  function send() {
    const text = $('input').value.trim();
    if (!text || busy) return;
    add('msg me', text);
    $('input').value = '';
    bridge.send('ask', text);
  }
  $('send').onclick = () => (busy ? bridge.send('stop') : send());
  $('input').onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } };
  $('close').onclick = () => bridge.send('hide-chat');
  $('new').onclick = () => bridge.send('new-chat');
  addEventListener('keydown', (e) => { if (e.key === 'Escape') bridge.send('hide-chat'); });

  // Claude needs approval for actions the current permission mode doesn't allow
  function askCard(items) {
    const card = add('ask', 'May I do this?');
    const list = document.createElement('ul');
    for (const i of items) list.append(Object.assign(document.createElement('li'), { textContent: i.text }));
    const row = document.createElement('div');
    const yes = Object.assign(document.createElement('button'), { className: 'primary', textContent: 'Allow' });
    const no = Object.assign(document.createElement('button'), { textContent: 'Deny' });
    const done = (note) => { yes.disabled = no.disabled = true; add('tool', note); };
    yes.onclick = () => { done('✓ allowed'); bridge.send('allow', items.map((i) => i.rule)); };
    no.onclick = () => done('✗ denied');
    row.append(yes, no);
    card.append(list, row);
    yes.focus();
  }

  bridge.on('claude', (m) => {
    if (m.type === 'text') add('msg bot', m.text);
    if (m.type === 'tool') add('tool', '▸ ' + m.text);
    if (m.type === 'error') add('msg bot error', m.text);
    if (m.type === 'ask') askCard(m.items);
    if (m.type === 'reset') { log.innerHTML = ''; greet(); }
    if (m.type === 'busy') {
      busy = m.on;
      $('send').textContent = busy ? 'Stop' : 'Send';
      $('status').textContent = busy ? 'Working…' : '';
      if (!busy) $('input').focus();
    }
  });
</script>
</body>
</html>
